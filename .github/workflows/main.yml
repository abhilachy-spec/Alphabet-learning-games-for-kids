name: Build Alphabet Game APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o AlphabetGameApp-fixed-2.zip -d android-project

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" >> android-project/gradle.properties
          echo "android.enableJetifier=true" >> android-project/gradle.properties

      - name: Find Android project
        run: |
          find android-project -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find android-project -name settings.gradle -o -name settings.gradle.kts | head -1)")
          echo "Android project: $PROJECT"
          gradle -p "$PROJECT" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlphabetGame-debug-apk
          path: 'android-project/**/build/outputs/apk/debug/*.apk'
